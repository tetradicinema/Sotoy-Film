      - name: Run TMDB sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APPLY: ${{ github.event.inputs.apply }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          CRON_APPLY: ${{ vars.TMDB_CRON_APPLY }}
        run: |
          ARGS=()
          if [[ "$EVENT_NAME" == "schedule" && "$CRON_APPLY" == "true" ]] || [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_APPLY" == "true" ]]; then
            ARGS+=(--apply)
          fi
          if [[ "$INPUT_FORCE" == "true" ]]; then
            ARGS+=(--force)
          fi
          npx tsx scripts/sync-tmdb-cron.ts "${ARGS[@]}"

      - name: Delete service account key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
